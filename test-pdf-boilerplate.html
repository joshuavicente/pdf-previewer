<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Preview Test</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: sans-serif;
        padding: 32px;
      }

      h1 {
        margin-top: 64px;
        margin-bottom: 16px;
      }

      .pdf-wrapper {
        width: min(100%, 800px);
        max-width: 100%;
      }

      .link-share {
        background: none;
        border: none;
        color: #0066cc;
        cursor: pointer;
        font-size: 0.95rem;
        text-decoration: underline;
        padding: 0;
      }

      .link-share:hover {
        color: #0052a3;
      }

      .pdf-viewer {
        height: min(1123px, calc(100dvh - 400px));
        width: 100%;
        display: block;
      }

      .button-row {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
        width: min(100%, 800px);
      }

      /* Desktop: side by side, Back on the left and Download on the right. */
      @media (min-width: 768px) {
        .button-row {
          flex-direction: row-reverse;
          justify-content: center;
        }
      }

      button,
      a.btn-download {
        padding: 10px 20px;
        font-size: 0.95rem;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      a.btn-download {
        display: inline-block;
        text-decoration: none;
      }

      .btn-back,
      a.btn-download {
        width: min(100%, 240px);
        border-radius: 999px;
        text-align: center;
        box-sizing: border-box;
      }

      .pdf-fallback {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        height: 100%;
        padding: 24px;
        box-sizing: border-box;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        text-align: center;
      }

      .pdf-fallback-link {
        color: #0066cc;
        font-size: 0.95rem;
        font-weight: bold;
      }

      .btn-back {
        background-color: #e0e0e0;
        color: #333;
      }
      .btn-download {
        background-color: #0066cc;
        color: white;
      }

      .btn-back:hover {
        background-color: #c8c8c8;
      }
      .btn-download:hover {
        background-color: #0052a3;
      }

      .share-row {
        margin-top: 16px;
      }

      @media (min-width: 768px) {
        .share-row {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <h1>View Individual Tax Notices</h1>

    <div class="pdf-wrapper">
      <object
        class="pdf-viewer"
        data="test_notice.pdf#toolbar=0&navpanes=0&scrollbar=0"
        type="application/pdf"
        aria-label="PDF document preview"
      >
        <div class="pdf-fallback">
          <h3>Preview Unavailable</h3>
          <div>
            Your browser cannot display the notice preview here. You can
            <a
              class="pdf-fallback-link"
              id="pdfFallbackLink"
              href="test_notice.pdf"
              target="_blank"
              rel="noopener"
            >
              open the notice
            </a>
            in a separate tab to review it before downloading.
          </div>
        </div>
      </object>
    </div>

    <div class="button-row">
      <a class="btn-download" href="test_notice.pdf" download>Download</a>
      <button class="btn-back" onclick="history.back()">Back</button>
    </div>

    <div class="share-row" id="shareRow">
      <button class="link-share" onclick="shareLink()">Share Link</button>
    </div>

    <script>
      const PDF_PATH = "test_notice.pdf";
      const isAndroid = /Android/i.test(navigator.userAgent);

      // In-app browsers on Android (e.g. the Google app) are WebViews with no
      // PDF viewer and often ignore target="_blank", so hand the PDF to the
      // user's default browser.
      function browserIntentUrl(url) {
        const u = new URL(url);
        const scheme = u.protocol.replace(":", "");
        return (
          `intent://${u.host}${u.pathname}${u.search}` +
          `#Intent;scheme=${scheme};` +
          `S.browser_fallback_url=${encodeURIComponent(url)};end`
        );
      }

      function pdfUrl() {
        return new URL(PDF_PATH, window.location.href).href;
      }

      function openPdf() {
        if (isAndroid) {
          window.location.href = browserIntentUrl(pdfUrl());
        } else {
          window.open(pdfUrl(), "_blank", "noopener");
        }
      }

      if (isAndroid) {
        const link = document.getElementById("pdfFallbackLink");
        link.href = browserIntentUrl(pdfUrl());
        link.removeAttribute("target");
      }

      if (!navigator.share) {
        document.getElementById("shareRow").hidden = true;
      }

      async function shareLink() {
        try {
          await navigator.share({
            title: document.title,
            text: "View my tax notice",
            url: window.location.href,
          });
        } catch (err) {
          if (err.name !== "AbortError") {
            console.error("Failed to share link:", err);
          }
        }
      }
    </script>
  </body>
</html>
