<h2>View Individual Tax Notices</h2>

<div class="pdf-wrapper">
  <object
    class="pdf-viewer"
    [data]="objectUrl"
    type="application/pdf"
    aria-label="PDF document preview"
  >
    <div class="pdf-fallback">
      <h3>Preview Unavailable</h3>
      <div>
        Your browser cannot display the notice preview here. You can
        <a
          class="pdf-fallback-link"
          [href]="src"
          target="_blank"
          rel="noopener"
          (click)="openPdf($event)"
        >
          open the notice<img
            class="icon icon-link"
            src="assets/pdf-icons/link.svg"
            alt=""
        /></a>
        in a separate tab to review it before downloading.
      </div>
    </div>
  </object>
</div>

<div class="button-row">
  <a class="btn-download" [href]="src" download>Download</a>
  <button class="btn-back" type="button" (click)="back()">Back</button>
</div>

<div class="share-row" *ngIf="canShare">
  <button class="link-share" type="button" (click)="shareLink()">
    <img class="icon" src="assets/pdf-icons/share.svg" alt="" />
    <span>Share Link</span>
  </button>
</div>
